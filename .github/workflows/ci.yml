name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dependencies and filesystem: fails the pipeline on a critical finding
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Leaked credentials: the brief penalises secrets in the repository history
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build image
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t app:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: app:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish image
    needs: [build-test, security, image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Docker tags must be lowercase, while a GitHub login can contain capitals.
      - name: Lowercase the image reference
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to kind
    needs: [security, image]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: st2dce

      - name: Build the image with the reference the manifests expect
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
          kind load docker-image "$IMAGE" --name st2dce

      - name: Point the overlay at this commit's image
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          cd k8s/overlays/dev
          kustomize edit set image "ghcr.io/jackyhuang75414/st2dce-project=${IMAGE}"
          cd -

      - name: Deploy
        run: |
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k k8s/overlays/dev
          kubectl rollout status deployment/app -n dev --timeout=180s

      - name: Smoke test
        run: |
          kubectl port-forward -n dev svc/app 8080:80 &
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          echo "smoke test failed"; exit 1
          
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n dev -o wide || true
          kubectl describe pods -n dev | tail -60 || true
          kubectl logs -n dev deploy/app --tail=50 || true